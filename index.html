            <line x1="10" y1="74" x2="530" y2="74" stroke="#cbd5e1" strokeWidth="1.5" />
            <text x="270" y="56" textAnchor="middle" className="font-handwriting font-bold" style={{ fontSize: '38px', letterSpacing: '2px' }}>
              <tspan fill="#1e1b4b">{beforeText}</tspan>
              {isBlank ? (
                <tspan fill="#d97706" className="tracking-widest">{"_".repeat(blankLength)}</tspan>
              ) : (
                <tspan fill="#4f46e5" className="font-handwriting">{text}</tspan>
              )}
              <tspan fill="#1e1b4b">{afterText}</tspan>
            </text>
          </svg>
        );
      }

      return (
        <svg viewBox="0 0 350 96" className="w-full h-24 bg-white rounded-2xl border border-slate-200 shadow-sm mx-auto max-w-xs select-none">
          <line x1="10" y1="20" x2="340" y2="20" stroke="#cbd5e1" strokeWidth="1.5" />
          <line x1="10" y1="38" x2="340" y2="38" stroke="#93c5fd" strokeWidth="1.5" strokeDasharray="4 3" />
          <line x1="10" y1="56" x2="340" y2="56" stroke="#f87171" strokeWidth="2.5" />
          <line x1="10" y1="74" x2="340" y2="74" stroke="#cbd5e1" strokeWidth="1.5" />
          <text x="175" y="56" textAnchor="middle" className="font-handwriting font-bold text-slate-900" style={{ fontSize: '42px', letterSpacing: '2px' }}>
            {text}
          </text>
        </svg>
      );
    }

    function App() {
      const [appMode, setAppMode] = useState('REGISTER'); 
      const [gameState, setGameState] = useState('LOBBY'); /* LOBBY, RPS, PLAYING */
      
      // Student details
      const [studentClass, setStudentClass] = useState('1'); 
      const [studentNum, setStudentNum] = useState('1'); 
      const [studentName, setStudentName] = useState('');
      const [isRegistered, setIsRegistered] = useState(false);
      
      // Board state for both study and game
      const [playerPosition, setPlayerPosition] = useState(1);
      const [aiPosition, setAiPosition] = useState(0);

      // Rock Paper Scissors
      const [rpsResult, setRpsResult] = useState(''); 
      const [rpsChoice, setRpsChoice] = useState(null); 
      const [aiRpsChoice, setAiRpsChoice] = useState(null);
      const [turn, setTurn] = useState('PLAYER'); 
      
      const [diceValue, setDiceValue] = useState(1);
      const [isDiceRolling, setIsDiceRolling] = useState(false);
      
      // Question Dialog State
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [attemptsLeft, setAttemptsLeft] = useState(3);
      const [showAnswerText, setShowAnswerText] = useState(false);
      const [speechStatus, setSpeechStatus] = useState('idle'); 
      const [heardText, setHeardText] = useState('');
      const [showWritingPaper, setShowWritingPaper] = useState(false);

      // Mini-games inside tiles
      const [coloredMice, setColoredMice] = useState([false, false, false]); 
      const [poppedBubbles, setPoppedBubbles] = useState({ ball: false, close: false, duck: false, pizza: false });

      const [ttsMode, setTtsMode] = useState('both'); 
      const [playerSkipNext, setPlayerSkipNext] = useState(false);
      const [aiSkipNext, setAiSkipNext] = useState(false);

      const [toastMessage, setToastMessage] = useState('');
      const [deletingStudentId, setDeletingStudentId] = useState(null);

      // Firebase Config & Sync State
      const [firebaseConfig, setFirebaseConfig] = useState(null);
      const [appId, setAppId] = useState(DEFAULT_APP_ID);
      const [fbConfigReady, setFbConfigReady] = useState(false);
      const [showDbConfigModal, setShowDbConfigModal] = useState(false);
      const [showClearConfigConfirm, setShowClearConfigConfirm] = useState(false);

      // Firebase DB config inputs
      const [inputApiKey, setInputApiKey] = useState('');
      const [inputAuthDomain, setInputAuthDomain] = useState('');
      const [inputProjectId, setInputProjectId] = useState('');
      const [inputStorageBucket, setInputStorageBucket] = useState('');
      const [inputMessagingSender, setInputMessagingSender] = useState('');
      const [inputAppId, setInputAppId] = useState('');
      const [inputCustomAppId, setInputCustomAppId] = useState(DEFAULT_APP_ID);

      const [firebaseUser, setFirebaseUser] = useState(null);
      const [studentsProgress, setStudentsProgress] = useState([]); 
      const [teacherMessage, setTeacherMessage] = useState(''); 
      const [isScreenLocked, setIsScreenLocked] = useState(false); 
      const [teacherPassword, setTeacherPassword] = useState('');
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [statsSummary, setStatsSummary] = useState({ totalActive: 0, avgProgress: 0, leadScore: 0 });

      // Step 3 (Writing Mode) checklist
      const [bonusRevealed, setBonusRevealed] = useState({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false }); 
      const [bonusDoneStatus, setBonusDoneStatus] = useState({ 1: null, 2: null, 3: null, 4: null, 5: null, 6: null }); 

      // 관제탑 전용: 학반 탭 선택 상태 ('ALL' 또는 '1'~'10')
      const [selectedClassTab, setSelectedClassTab] = useState('ALL');

      const recognitionRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      // ===================================================
      // [메모리기반 실시간 정렬 및 학급 분류 연산] (Derived States)
      // ===================================================
      const sortedStudentsProgress = [...studentsProgress].sort((a, b) => {
        const classA = parseInt(a.classNum) || 0;
        const classB = parseInt(b.classNum) || 0;
        if (classA !== classB) return classA - classB;
        return (parseInt(a.studentNum) || 0) - (parseInt(b.studentNum) || 0);
      });

      const loggedClasses = Array.from(
        new Set(studentsProgress.map(s => parseInt(s.classNum)).filter(val => !isNaN(val) && val > 0))
      ).sort((a, b) => a - b);

      const filteredStudents = sortedStudentsProgress.filter(student => {
        if (selectedClassTab === 'ALL') return true;
        return (student.classNum || '').toString() === selectedClassTab;
      });

      // 1-1. Firebase Config 로딩 (우선순위: 하드코딩 > localStorage)
      useEffect(() => {
        if (DEFAULT_FIREBASE_CONFIG.apiKey) {
          setFirebaseConfig(DEFAULT_FIREBASE_CONFIG);
          setAppId(DEFAULT_APP_ID);
          setFbConfigReady(true);
        } else {
          const saved = localStorage.getItem('dotori_firebase_config_v1');
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              setFirebaseConfig(parsed.config);
              setAppId(parsed.appId || DEFAULT_APP_ID);
              setFbConfigReady(true);
            } catch (e) {
              setShowDbConfigModal(true);
            }
          } else {
            // 자가 설정 마법사 트리거
            setShowDbConfigModal(true);
          }
        }
      }, []);

      // 1-2. Firebase Auth Setup (Rule 3 Compliant, 중복 방지 getApps/getApp 적용)
      useEffect(() => {
        if (!fbConfigReady || !firebaseConfig || !window.FbApp) return;
        try {
          // 중복 초기화 방지 로직 적용
          const apps = window.FbApp.getApps();
          const app = apps.length > 0 ? window.FbApp.getApp() : window.FbApp.initializeApp(firebaseConfig);
          const auth = window.FbAuth.getAuth(app);
          
          const initAuth = async () => {
            // Vercel 환경용 순수 익명 로그인 활성화
            await window.FbAuth.signInAnonymously(auth);
          };
          initAuth();
          const unsubscribe = window.FbAuth.onAuthStateChanged(auth, setFirebaseUser);
          return () => unsubscribe();
        } catch (e) {
          console.error("Firebase init failed:", e);
          showToast("❌ Firebase 초기화 실패. 설정값을 다시 확인하세요.");
        }
      }, [fbConfigReady, firebaseConfig]);

      // 2. Student Mode Real-time Listener (Locks, Warps, Teacher stickers)
      useEffect(() => {
        if (!firebaseUser || !window.FbDb || !isRegistered || !fbConfigReady) return;
        if (appMode === 'TEACHER_DASHBOARD' || appMode === 'REGISTER') return;

        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', firebaseUser.uid);

        const unsubscribe = window.FbDb.onSnapshot(studentRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.isLocked !== undefined) setIsScreenLocked(data.isLocked);
            
            if (data.teacherCommand) {
              const cmd = data.teacherCommand;
              if (cmd.type === 'warp') {
                if (cmd.phase) {
                  setAppMode(cmd.phase);
                  if (cmd.phase === 'STUDY') setPlayerPosition(cmd.target || 1);
                  if (cmd.phase === 'GAME') {
                    setPlayerPosition(cmd.target || 0);
                    setGameState('PLAYING');
                  }
                  addStudentLog(`선생님이 나를 [${cmd.phase}] 단계로 이동시키셨습니다! 💫`);
                } else {
                  setPlayerPosition(cmd.target);
                  addStudentLog(`선생님이 나를 말판 ${cmd.target}번으로 소환하셨습니다. ✨`);
                }
              }
              if (cmd.type === 'message') {
                setTeacherMessage(cmd.text);
                playSound('correct');
              }
              window.FbDb.updateDoc(studentRef, { teacherCommand: null });
            }
          }
        }, (err) => {
          console.error("Student sync read error:", err);
        });

        return () => unsubscribe();
      }, [firebaseUser, isRegistered, appMode, fbConfigReady]);

      // 3. Teacher Dashboard Listener (Rule 2: memory-sorting)
      useEffect(() => {
        if (!firebaseUser || !window.FbDb || appMode !== 'TEACHER_DASHBOARD' || !fbConfigReady) return;

        const db = window.FbDb.getFirestore();
        const progressCol = window.FbDb.collection(db, 'artifacts', appId, 'public', 'data', 'progress');

        const unsubscribe = window.FbDb.onSnapshot(progressCol, (snapshot) => {
          const list = [];
          let activeCount = 0;
          let progressSum = 0;
          let topScore = 0;
          const fiveMinAgo = Date.now() - 5 * 60 * 1000;

          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            list.push({ id: docSnap.id, ...data });

            if (data.lastActive && data.lastActive > fiveMinAgo) activeCount++;
            progressSum += data.currentPosition || 0;
            if ((data.correctCount || 0) > topScore) topScore = data.correctCount || 0;
          });

          setStudentsProgress(list);
          setStatsSummary({
            totalActive: activeCount,
            avgProgress: list.length > 0 ? Math.round(progressSum / list.length) : 0,
            leadScore: topScore
          });
        }, (err) => {
          console.error("Teacher dashboard stream failed:", err);
        });

        return () => unsubscribe();
      }, [firebaseUser, appMode, fbConfigReady]);

      // 4. Speech Recognition setup
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'en-US';

          rec.onstart = () => setSpeechStatus('listening');
          rec.onresult = (event) => {
            const text = event.results[0][0].transcript.toLowerCase().trim();
            setHeardText(text);
            
            if (!currentQuestion) return;
            const expected = currentQuestion.question.expectedAnswers || [];
            const isCorrect = expected.some(ans => text.includes(ans.toLowerCase()));
            
            if (isCorrect) {
              playSound('correct');
              setSpeechStatus('success');
              addStudentLog(`🗣️ 발음 정답 성공: "${text}"`);
              setTimeout(() => resolveQuestion(true), 1500);
            } else {
              playSound('wrong');
              const next = attemptsLeft - 1;
              setAttemptsLeft(next);
              addStudentLog(`🗣️ 발음 실패: "${text}" (남은 기회 ${next}회)`);
              if (next <= 0) {
                setSpeechStatus('fail');
                setTimeout(() => resolveQuestion(false), 2000);
              } else {
                setSpeechStatus('idle');
              }
            }
          };
          rec.onerror = () => setSpeechStatus('idle');
          rec.onend = () => setSpeechStatus('idle');
          recognitionRef.current = rec;
        }
      }, [currentQuestion, attemptsLeft]);

      const resetAudioEngine = () => {
        playSound('correct');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            const tempCtx = new AudioContextClass();
            if (tempCtx.state === 'suspended') tempCtx.resume();
            const osc = tempCtx.createOscillator();
            const gain = tempCtx.createGain();
            osc.connect(gain);
            gain.connect(tempCtx.destination);
            osc.frequency.setValueAtTime(600, tempCtx.currentTime);
            gain.gain.setValueAtTime(0.04, tempCtx.currentTime);
            osc.start();
            osc.stop(tempCtx.currentTime + 0.1);
          }
        } catch(e) {
          console.warn("Failed to reset audio context:", e);
        }
        showToast("🔊 소리 합성 시스템이 새로고침 되었습니다!");
        speakText("Sound engine reset.");
      };

      const addStudentLog = async (logText) => {
        if (!firebaseUser || !window.FbDb || !isRegistered) return;
        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', firebaseUser.uid);
        try {
          const snap = await window.FbDb.getDoc(studentRef);
          let currentLogs = [];
          if (snap.exists() && snap.data().logs) {
            currentLogs = snap.data().logs;
          }
          currentLogs = [{ timestamp: Date.now(), text: logText }, ...currentLogs].slice(0, 4);
          await window.FbDb.updateDoc(studentRef, {
            logs: currentLogs,
            lastActive: Date.now()
          });
        } catch (e) {
          console.error("Activity log push failure:", e);
        }
      };

      const syncStudentProgress = async (pos, updates = {}) => {
        if (!firebaseUser || !window.FbDb || !isRegistered) return;
        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', firebaseUser.uid);
        const formattedName = `3학년 ${studentClass}반 ${studentNum}번 ${studentName}`;

        let displayStatus = '탐험 중 🏃';
        if (appMode === 'STUDY') displayStatus = `[1단계 공부] ${pos}/27`;
        else if (appMode === 'GAME') displayStatus = `[2단계 게임] ${pos}칸`;
        else if (appMode === 'WRITING') {
          const doneCount = Object.values(bonusDoneStatus).filter(v => v === 'completed').length;
          displayStatus = `[3단계 쓰기] ${doneCount}/6개`;
        } else if (appMode === 'FINISH_ALL') displayStatus = '🏆 최종 완주!';

        try {
          await window.FbDb.setDoc(studentRef, {
            name: formattedName,
            classNum: parseInt(studentClass),
            studentNum: parseInt(studentNum),
            realName: studentName,
            currentPosition: pos,
            lastActive: Date.now(),
            appMode: appMode, 
            status: displayStatus,
            ...updates
          }, { merge: true });
        } catch (e) {
          console.error("Firestore sync error:", e);
        }
      };

      const sendTeacherMessage = async (studentId, msg) => {
        if (!window.FbDb) return;
        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', studentId);
        playSound('click');
        try {
          await window.FbDb.updateDoc(studentRef, {
            teacherCommand: { type: 'message', text: msg }
          });
        } catch (e) {
          console.error("Sticker send failed:", e);
        }
      };

      const warpStudent = async (studentId, step, forcePhase = null) => {
        if (!window.FbDb) return;
        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', studentId);
        playSound('click');
        try {
          await window.FbDb.updateDoc(studentRef, {
            teacherCommand: { 
              type: 'warp', 
              target: step, 
              phase: forcePhase 
            }
          });
        } catch (e) {
          console.error("Warp failed:", e);
        }
      };

      const toggleScreenLock = async (studentId, isLockedNow) => {
        if (!window.FbDb) return;
        const db = window.FbDb.getFirestore();
        const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', studentId);
        playSound('pop');
        try {
          await window.FbDb.updateDoc(studentRef, { isLocked: !isLockedNow });
        } catch (e) {
          console.error("Lock toggle failed:", e);
        }
      };

      const handleRegisterStudent = async (e) => {
        e.preventDefault();
        if (!studentName.trim()) return;

        playSound('click');
        setIsRegistered(true);
        setAppMode('STUDY');
        setPlayerPosition(1);

        const formattedName = `3학년 ${studentClass}반 ${studentNum}번 ${studentName}`;

        if (firebaseUser && window.FbDb) {
          const db = window.FbDb.getFirestore();
          const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', firebaseUser.uid);
          await window.FbDb.setDoc(studentRef, {
            uid: firebaseUser.uid,
            name: formattedName,
            classNum: parseInt(studentClass),
            studentNum: parseInt(studentNum),
            realName: studentName,
            currentPosition: 1,
            correctCount: 0,
            wrongCount: 0,
            lastActive: Date.now(),
            appMode: 'STUDY',
            status: '[1단계 공부] 1/27',
            logs: [{ timestamp: Date.now(), text: "도토리 숲 배움 탐험선에 탑승했습니다! 1단계 공부를 시작합니다." }],
            isLocked: false
          });
        }
      };

      const getNextStudyPos = (currentPos) => {
        let next = currentPos + 1;
        while (next < EXPEDITION_TILES.length - 1) {
          const type = EXPEDITION_TILES[next].type;
          if (!['START', 'SKIP', 'ADVANCE', 'BACKWARD'].includes(type)) return next;
          next++;
        }
        return EXPEDITION_TILES.length - 1; /* FINISH */
      };

      const getPrevStudyPos = (currentPos) => {
        let prev = currentPos - 1;
        while (prev > 0) {
          const type = EXPEDITION_TILES[prev].type;
          if (!['START', 'SKIP', 'ADVANCE', 'BACKWARD'].includes(type)) return prev;
          prev--;
        }
        return 1;
      };

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = typeof SpeechSynthesisUtterance !== 'undefined' ? new SpeechSynthesisUtterance(text) : null;
          if (u) {
            u.lang = 'en-US';
            u.rate = 0.8;
            window.speechSynthesis.speak(u);
          }
        }
      };

      const handleRpsPlay = (choice) => {
        playSound('click');
        const choices = ['scissors', 'rock', 'paper'];
        const aiChoice = choices[Math.floor(Math.random() * 3)];
        setRpsChoice(choice);
        setAiRpsChoice(aiChoice);

        let result = '';
        if (choice === aiChoice) {
          result = 'TIE';
        } else if (
          (choice === 'rock' && aiChoice === 'scissors') ||
          (choice === 'paper' && aiChoice === 'rock') ||
          (choice === 'scissors' && aiChoice === 'paper')
        ) {
          result = 'PLAYER';
        } else {
          result = 'AI';
        }

        setRpsResult(result);

        setTimeout(() => {
          if (result === 'TIE') {
            setRpsChoice(null);
            setAiRpsChoice(null);
            setRpsResult('');
          } else {
            setTurn(result === 'PLAYER' ? 'PLAYER' : 'AI');
            setGameState('PLAYING');
            if (result === 'AI') {
              setTimeout(() => aiTakeTurn(), 1200);
            }
          }
        }, 2000);
      };

      const rollDice = () => {
        if (isDiceRolling || turn !== 'PLAYER' || currentQuestion) return;
        playSound('dice');
        setIsDiceRolling(true);
        let count = 0;
        const interval = setInterval(() => {
          setDiceValue(Math.floor(Math.random() * 6) + 1);
          count++;
          if (count > 8) {
            clearInterval(interval);
            setIsDiceRolling(false);
            const finalRoll = Math.floor(Math.random() * 6) + 1;
            setDiceValue(finalRoll);
            movePlayer(finalRoll);
          }
        }, 100);
      };

      const movePlayer = (steps) => {
        let currentPos = playerPosition;
        let targetPos = Math.min(playerPosition + steps, EXPEDITION_TILES.length - 1);

        const moveInterval = setInterval(() => {
          currentPos++;
          setPlayerPosition(currentPos);
          if (currentPos >= targetPos || currentPos >= EXPEDITION_TILES.length - 1) {
            clearInterval(moveInterval);
            
            syncStudentProgress(currentPos);
            addStudentLog(`🎲 주사위 ${steps}칸 던져 ${currentPos}단계 상륙!`);
            handleLanding(currentPos, 'PLAYER');
          }
        }, 250);
      };

      const moveAI = (steps) => {
        let currentPos = aiPosition;
        let targetPos = Math.min(aiPosition + steps, EXPEDITION_TILES.length - 1);

        const moveInterval = setInterval(() => {
          currentPos++;
          setAiPosition(currentPos);
          if (currentPos >= targetPos || currentPos >= EXPEDITION_TILES.length - 1) {
            clearInterval(moveInterval);
            handleLanding(currentPos, 'AI');
          }
        }, 250);
      };

      const handleLanding = (pos, entity) => {
        const tile = EXPEDITION_TILES[pos];

        if (pos >= EXPEDITION_TILES.length - 1) {
          playSound('correct');
          setGameState('LOBBY');
          addStudentLog(`🏆 2단계 보드게임 완주 성공!`);
          return;
        }

        if (tile.type === 'SKIP') {
          if (entity === 'PLAYER') {
            setPlayerSkipNext(true);
            setTurn('AI');
            addStudentLog(`💤 '한 번 쉬기' 함정 극복 중..`);
            setTimeout(aiTakeTurn, 1500);
          } else {
            setAiSkipNext(true);
            setTurn('PLAYER');
          }
          return;
        }

        if (tile.type === 'ADVANCE') {
          const nextPos = Math.min(pos + 2, EXPEDITION_TILES.length - 1);
          setTimeout(() => {
            if (entity === 'PLAYER') {
              setPlayerPosition(nextPos);
              syncStudentProgress(nextPos);
              addStudentLog(`🚀 앞으로 2칸 보너스 워프! (${nextPos}번으로)`);
              handleLanding(nextPos, 'PLAYER');
            } else {
              setAiPosition(nextPos);
              handleLanding(nextPos, 'AI');
            }
          }, 800);
          return;
        }

        if (tile.type === 'BACKWARD') {
          const nextPos = Math.max(pos - 2, 0);
          setTimeout(() => {
            if (entity === 'PLAYER') {
              setPlayerPosition(nextPos);
              syncStudentProgress(nextPos);
              addStudentLog(`👈 뒤로 2칸 페널티 이동.. (${nextPos}번으로)`);
              handleLanding(nextPos, 'PLAYER');
            } else {
              setAiPosition(nextPos);
              handleLanding(nextPos, 'AI');
            }
          }, 800);
          return;
        }

        if (entity === 'PLAYER') {
          setCurrentQuestion({ pos, question: tile, isPreview: false });
          setAttemptsLeft(3);
          setShowAnswerText(false);
          setSpeechStatus('idle');
          setHeardText('');
          setShowWritingPaper(false);
          setColoredMice([false, false, false]);
          setPoppedBubbles({ ball: false, close: false, duck: false, pizza: false });

          if (tile.audioText && ttsMode === 'both') {
            setTimeout(() => speakText(tile.audioText), 600);
          }
        } else {
          setCurrentQuestion({ pos, question: tile, isAI: true });
          if (tile.type === 'WRITING') {
            setTimeout(() => speakText(`I can write this word. It is ${tile.textToDraw}.`), 500);
          } else {
            setTimeout(() => {
              const isCorrect = Math.random() > 0.25; 
              if (isCorrect) {
                const answer = tile.expectedAnswers ? tile.expectedAnswers[0] : (tile.answer || "Yes!");
                speakText(answer);
                setTimeout(() => {
                  setCurrentQuestion(null);
                  advanceTurnAfterAI();
                }, 1800);
              } else {
                speakText("I am not sure...");
                setTimeout(() => {
                  setCurrentQuestion(null);
                  advanceTurnAfterAI();
                }, 1800);
              }
            }, 1500);
          }
        }
      };

      const aiTakeTurn = () => {
        playSound('dice');
        setIsDiceRolling(true);
        let count = 0;
        const interval = setInterval(() => {
          setDiceValue(Math.floor(Math.random() * 6) + 1);
          count++;
          if (count > 8) {
            clearInterval(interval);
            setIsDiceRolling(false);
            const finalRoll = Math.floor(Math.random() * 6) + 1;
            setDiceValue(finalRoll);
            moveAI(finalRoll);
          }
        }, 100);
      };

      const resolveQuestion = async (success) => {
        setCurrentQuestion(null);

        if (isRegistered && firebaseUser) {
          const db = window.FbDb.getFirestore();
          const studentRef = window.FbDb.doc(db, 'artifacts', appId, 'public', 'data', 'progress', firebaseUser.uid);
          const snap = await window.FbDb.getDoc(studentRef);
          if (snap.exists()) {
            const currentData = snap.data();
            const correctNow = currentData.correctCount || 0;
            const wrongNow = currentData.wrongCount || 0;
            await window.FbDb.updateDoc(studentRef, {
              correctCount: success ? correctNow + 1 : correctNow,
              wrongCount: success ? wrongNow : wrongNow + 1
            });
          }
        }

        if (appMode === 'STUDY') {
          const nextStudyPos = getNextStudyPos(playerPosition);
          if (nextStudyPos >= EXPEDITION_TILES.length - 1) {
            playSound('correct');
            setPlayerPosition(EXPEDITION_TILES.length - 1);
            syncStudentProgress(EXPEDITION_TILES.length - 1);
            addStudentLog(`🏆 1단계 공부 모드를 올 패스 완수했습니다!`);
          } else {
            playSound('correct');
            setPlayerPosition(nextStudyPos);
            syncStudentProgress(nextStudyPos);
          }
        } else {
          if (aiSkipNext) {
            setAiSkipNext(false);
            setTurn('PLAYER');
          } else {
            setTurn('AI');
            setTimeout(aiTakeTurn, 1500);
          }
        }
      };

      const handleOfflineWritingConfirm = (status) => {
        playSound('click');
        if (status === 'success') {
          playSound('correct');
          setSpeechStatus('success');
          addStudentLog(`[${playerPosition}단계 쓰기] 공책에 단어를 바르게 작성했습니다.`);
          speakText(currentQuestion.question.textToDraw);
          setTimeout(() => resolveQuestion(true), 1500);
        } else {
          playSound('wrong');
          const next = attemptsLeft - 1;
          setAttemptsLeft(next);
          if (next <= 0) {
            setSpeechStatus('fail');
            setTimeout(() => resolveQuestion(false), 2000);
          }
        }
      };

      const selectChoice = (selectedOption) => {
        playSound('click');
        if (selectedOption === currentQuestion.question.answer) {
          playSound('correct');
          setSpeechStatus('success');
          addStudentLog(`[${playerPosition}단계 선택] "${selectedOption}" 성공!`);
          speakText(selectedOption);
          setTimeout(() => resolveQuestion(true), 1500);
        } else {
          playSound('wrong');
          const next = attemptsLeft - 1;
          setAttemptsLeft(next);
          if (next <= 0) {
            setSpeechStatus('fail');
            setTimeout(() => resolveQuestion(false), 2000);
          }
        }
      };

      const handleColorMouse = (index) => {
        playSound('pop');
        const updated = [...coloredMice];
        updated[index] = !updated[index];
        setColoredMice(updated);

        const count = updated.filter(Boolean).length;
        if (count === 2) {
          setTimeout(() => {
            playSound('correct');
            setSpeechStatus('success');
            addStudentLog(`[20단계 색칠] 생쥐 2마리 탐지 색칠 완료!`);
            setTimeout(() => resolveQuestion(true), 1500);
          }, 400);
        }
      };

      const handlePopBubble = (key) => {
        if (key === 'close') {
          playSound('pop');
          setPoppedBubbles(prev => ({ ...prev, [key]: true }));
          setTimeout(() => {
            playSound('correct');
            setSpeechStatus('success');
            addStudentLog(`[21단계 풍선 터뜨리기] 'close' 성공!`);
            speakText('close');
            setTimeout(() => resolveQuestion(true), 1500);
          }, 500);
        } else {
          playSound('wrong');
        }
      };

      const hashTextSHA256 = async (str) => {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

      const handlePasswordVerify = async (e) => {
        e.preventDefault();
        const hashedInput = await hashTextSHA256(teacherPassword.trim());
        if (hashedInput === '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4') {
          playSound('correct');
          setAppMode('TEACHER_DASHBOARD');
          setShowPasswordModal(false);
          setTeacherPassword('');
        } else {
          playSound('wrong');
          showToast("🔑 비밀번호가 다릅니다.");
        }
      };

      const handleMarkBonusDone = (itemId) => {
        playSound('correct');
        const updated = { ...bonusDoneStatus, [itemId]: 'completed' };
        setBonusDoneStatus(updated);

        const doneCount = Object.values(updated).filter(v => v === 'completed').length;
        addStudentLog(`[3단계 쓰기] ${itemId}번 문장 완성 (${doneCount}/6) 📝`);
        
        syncStudentProgress(playerPosition, { bonusDoneStatus: updated });
      };

      const proceedToGameMode = () => {
        playSound('correct');
        setAppMode('GAME');
        setGameState('LOBBY');
        setPlayerPosition(0);
        setAiPosition(0);
        syncStudentProgress(0, { appMode: 'GAME', status: '[2단계 게임] 출발 대기' });
      };

      const proceedToWritingMode = () => {
        playSound('correct');
        setAppMode('WRITING');
        syncStudentProgress(0, { appMode: 'WRITING', status: '[3단계 쓰기] 진행 중' });
      };

      const handleFinishAllExpedition = () => {
        playSound('correct');
        setAppMode('FINISH_ALL');
        syncStudentProgress(28, { appMode: 'FINISH_ALL', status: '🏆 최종 완주 완료!' });
      };

      const handleRestartFromScratch = () => {
        playSound('click');
        setAppMode('STUDY');
        setPlayerPosition(1);
        setAiPosition(0);
        setBonusDoneStatus({ 1: null, 2: null, 3: null, 4: null, 5: null, 6: null });
        setBonusRevealed({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false });
        syncStudentProgress(1, { appMode: 'STUDY', status: '[1단계 공부] 1/27' });
      };

      const exitToSplashSelector = () => {
        playSound('click');
        setAppMode('REGISTER');
        setGameState('LOBBY');
        setIsRegistered(false);
        setPlayerPosition(1);
        setAiPosition(0);
        setRpsChoice(null);
        setAiRpsChoice(null);
        setRpsResult('');
        setPlayerSkipNext(false);
        setAiSkipNext(false);
        setCurrentQuestion(null);

      const handleToggleBonusReveal = (itemId, targetWord, displayBefore, displayAfter) => {
        playSound('click');
        const isCurrentlyRevealed = bonusRevealed[itemId];
        setBonusRevealed(prev => ({ ...prev, [itemId]: !isCurrentlyRevealed }));

        if (!isCurrentlyRevealed) {
          speakText(`${displayBefore} ${targetWord} ${displayAfter}`);
        }
      };

      const handleShowOfflineWritingAnswer = () => {
        playSound('click');
        setShowWritingPaper(true);
      };

      const startListening = () => {
        playSound('click');
        if (recognitionRef.current) {
          try {
            recognitionRef.current.start();
          } catch(e) {
            console.warn("Recognition already active:", e);
          }
        }
      };

      const handleTileClick = (index) => {
        if (appMode !== 'STUDY') return; 
        const tile = EXPEDITION_TILES[index];
        if (['START', 'FINISH', 'SKIP', 'ADVANCE', 'BACKWARD'].includes(tile.type)) return;

        playSound('click');
        setPlayerPosition(index);
        syncStudentProgress(index);
        setCurrentQuestion({ pos: index, question: tile, isPreview: false });
        setAttemptsLeft(3);
        setShowAnswerText(false);
        setHeardText('');
        setSpeechStatus('idle');
        setShowWritingPaper(false);
        setColoredMice([false, false, false]);
        setPoppedBubbles({ ball: false, close: false, duck: false, pizza: false });

        if (tile.audioText && ttsMode === 'both') {
          setTimeout(() => speakText(tile.audioText), 500);
        }
      };

      // Vercel 브라우저 기반 Firebase 동적 연동 구성 제출 핸들러 (경고 alert를 토스트로 교체)
      const handleSaveDynamicConfig = (e) => {
        e.preventDefault();
        if (!inputApiKey || !inputProjectId || !inputAppId) {
          showToast("⚠️ API Key, Project ID, App ID는 필수 입력 사항입니다.");
          return;
        }

        const customConfig = {
          apiKey: inputApiKey.trim(),
          authDomain: inputAuthDomain.trim() || `${inputProjectId.trim()}.firebaseapp.com`,
          projectId: inputProjectId.trim(),
          storageBucket: inputStorageBucket.trim() || `${inputProjectId.trim()}.appspot.com`,
          messagingSenderId: inputMessagingSender.trim(),
          appId: inputAppId.trim()
        };

        const targetAppId = inputCustomAppId.trim() || DEFAULT_APP_ID;

        localStorage.setItem('dotori_firebase_config_v1', JSON.stringify({
          config: customConfig,
          appId: targetAppId
        }));

        setFirebaseConfig(customConfig);
        setAppId(targetAppId);
        setFbConfigReady(true);
        setShowDbConfigModal(false);
        playSound('correct');
        showToast("💾 Firebase 연동 마법사가 완료되었습니다!");
      };

      // 자가 설정 브라우저 초기화 핸들러 (선생님 교사용 기능 - confirm을 커스텀 확인 창으로 변경)
      const executeClearConfig = () => {
        localStorage.removeItem('dotori_firebase_config_v1');
        setShowClearConfigConfirm(false);
        playSound('correct');
        showToast("🧹 연동 설정이 안전하게 제거되었습니다. 곧 새로고침됩니다.");
        setTimeout(() => {
          window.location.reload();

      const renderExpeditionGrid = () => {

          [0, 1, 2, 3, 4, 5, 6],

        return (
          <div className="grid grid-cols-7 gap-2 sm:gap-3 p-3 sm:p-5 rounded-3xl canvas-wood shadow-inner relative border-4 border-amber-200">
            {rows.map((rowArr) => 
              rowArr.map((tileIndex) => {
                const tile = EXPEDITION_TILES[tileIndex];
                if (!tile) return null;
                const hasPlayer = playerPosition === tileIndex;
                const hasAI = appMode === 'GAME' && aiPosition === tileIndex;

                let customStyle = tile.color || 'bg-white border-2 hover:border-amber-300 shadow-sm';
                if (tile.type === 'SPEECH') customStyle += ' hover:bg-rose-50 border-rose-300 border-dashed';
                if (tile.type === 'PHONICS') customStyle += ' hover:bg-pink-50 border-pink-300 border-dashed';
                if (tile.type === 'WRITING') customStyle += ' hover:bg-sky-50 border-sky-300 border-dashed';
                if (tile.type === 'CHOICE' || tile.type === 'WORDPOP') customStyle += ' hover:bg-emerald-50 border-emerald-300 border-dashed';
                if (tile.type === 'COLORING') customStyle += ' hover:bg-violet-50 border-violet-300 border-dashed';
                if (tile.type === 'ALPHABET_SONG') customStyle += ' hover:bg-indigo-50 border-indigo-300 border-dashed';

                const clickable = appMode === 'STUDY' && !['START', 'FINISH', 'SKIP', 'ADVANCE', 'BACKWARD'].includes(tile.type);

                let skillLabel = '';
                let skillBg = 'bg-pink-500';
                if (tile.type === 'SPEECH') { 
                  skillLabel = '말하기 🗣️'; 
                  skillBg = 'bg-rose-500'; 
                } else if (tile.type === 'PHONICS') { 
                  skillLabel = '파닉스 🧩'; 
                  skillBg = 'bg-pink-500'; 
                } else if (tile.type === 'WRITING') { 
                  skillLabel = '쓰기 ✏️'; 
                  skillBg = 'bg-sky-500'; 
                } else if (tile.type === 'CHOICE' || tile.type === 'WORDPOP') { 
                  skillLabel = '읽기 📖'; 
                  skillBg = 'bg-emerald-500'; 
                } else if (tile.type === 'COLORING') { 
                  skillLabel = '듣기 👂'; 
                  skillBg = 'bg-violet-500'; 
                } else if (tile.type === 'ALPHABET_SONG') {
                  skillLabel = '노래방 🎤';
                  skillBg = 'bg-indigo-600';
                }

                return (
                  <div 
                    key={tileIndex} 
                    onClick={() => handleTileClick(tileIndex)}
                    className={`relative aspect-square flex flex-col items-center justify-center p-1 sm:p-2 rounded-2xl border-2 transition-all duration-300 ${customStyle} ${clickable ? 'cursor-pointer hover:scale-105 shadow-md border-emerald-500' : ''}`}
                  >
                    {clickable && (
                      <span className={`absolute -top-1.5 -right-1.5 ${skillBg} text-white font-black rounded-full text-[8px] sm:text-[10px] px-2 py-0.5 shadow-sm z-30 whitespace-nowrap`}>
                        {skillLabel}
                      </span>
                    )}

                    <span className="absolute bottom-1 right-1.5 text-[9px] sm:text-xs font-bold text-slate-400">
                      {tileIndex}
                    </span>

                    <div className="text-4xl sm:text-5xl select-none transform transition duration-300 flex items-center justify-center">
                      {tile.icon === 'FIG_SVG' ? (
                        <svg viewBox="0 0 100 100" className="w-10 h-10 sm:w-12 sm:h-12 drop-shadow" xmlns="http://www.w3.org/2000/svg">
                          <path d="M 50,10 Q 47,20 50,25" fill="none" stroke="#6d4c41" strokeWidth="6" strokeLinecap="round" />
                          <path d="M 50,22 Q 62,25 72,42 Q 82,60 76,76 Q 70,90 50,90 Q 30,90 24,76 Q 18,60 28,42 Q 38,25 50,22 Z" fill="#4a148c" stroke="#311b92" strokeWidth="3" />
                          <path d="M 50,27 Q 60,30 68,45 Q 76,60 71,73 Q 66,84 50,84 Q 34,84 29,73 Q 24,60 32,45 Q 40,30 50,27 Z" fill="#fff9c4" />
                          <path d="M 50,33 Q 57,36 64,48 Q 70,61 66,71 Q 61,79 50,79 Q 39,79 34,71 Q 30,61 36,48 Q 43,36 50,33 Z" fill="#e91e63" />
                        </svg>
                      ) : (
                        tile.icon
                      )}
                    </div>

                    {['START', 'FINISH', 'SKIP', 'ADVANCE', 'BACKWARD'].includes(tile.type) && (
                      <span className="text-[10px] sm:text-xs text-center font-black leading-none absolute bottom-1 sm:bottom-2">
                        {tile.label}
                      </span>
                    )}

                    <div className="absolute top-1 left-1.5 flex gap-1 z-10">
                      {hasPlayer && (
                        <div className="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-orange-400 border-2 border-white flex items-center justify-center shadow-lg z-20 animate-bounce token-transition">
                          <span className="text-xs sm:text-sm">👦</span>
                        </div>
                      )}
                      {hasAI && (
                        <div className="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-pink-500 border-2 border-white flex items-center justify-center shadow-lg z-20 animate-bounce token-transition">
                          <span className="text-xs sm:text-sm">🤖</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        );
      };

      const renderDiceDots = (val) => {
        const dotStyles = {
          1: ['row-start-2 col-start-2 bg-rose-600 w-5 h-5 sm:w-6 sm:h-6 rounded-full'],
          2: ['row-start-1 col-start-1', 'row-start-3 col-start-3'],
          3: ['row-start-1 col-start-1', 'row-start-2 col-start-2', 'row-start-3 col-start-3'],
          4: ['row-start-1 col-start-1', 'row-start-1 col-start-3', 'row-start-3 col-start-1', 'row-start-3 col-start-3'],
          5: ['row-start-1 col-start-1', 'row-start-1 col-start-3', 'row-start-2 col-start-2', 'row-start-3 col-start-1', 'row-start-3 col-start-3'],
          6: ['row-start-1 col-start-1', 'row-start-1 col-start-3', 'row-start-2 col-start-1', 'row-start-2 col-start-3', 'row-start-3 col-start-1', 'row-start-3 col-start-3']
        };
        const defaultDotClass = "bg-slate-800 w-3.5 h-3.5 sm:w-4.5 sm:h-4.5 rounded-full shadow-inner";
        return (
          <div className="grid grid-cols-3 grid-rows-3 gap-2 w-12 h-12 sm:w-16 sm:h-16 items-center justify-items-center">
            {dotStyles[val].map((posClass, i) => (
              <div key={i} className={val === 1 ? posClass : `${defaultDotClass} ${posClass}`} />
            ))}
          </div>
        );
      };

      if (isScreenLocked) {
        return (
          <div className="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center text-center p-6 z-50 animate-fade-in select-none">
            <span className="text-9xl animate-bounce">🛑</span>
            <h1 className="text-4xl sm:text-6xl font-black text-rose-500 mt-6 tracking-wide Jua font-bold">선생님 설명 시간!</h1>
            <p className="text-xl sm:text-2xl font-semibold text-slate-200 mt-4 max-w-xl leading-relaxed">
              영어 보드게임을 멈추고 숲속 칠판을 함께 바라볼까요? 🌳
            </p>
            <div className="mt-8 px-4 py-2 rounded-full bg-slate-800 text-slate-400 text-xs">
              선생님이 관제 대시보드에서 잠금을 해제하면 화면이 자동으로 복원됩니다.
            </div>
          </div>
        );
      }

      // Single layout container rendering logic to avoid early-return omissions
      return (
        <div className="w-full relative min-h-screen flex items-center justify-center p-1">
          
          {/* Main Views Container */}
          <div className="w-full max-w-[95vw] xl:max-w-[92vw]">
            
            {appMode === 'REGISTER' && (
              <div className="w-full flex flex-col items-center justify-center py-12 text-center px-4 max-w-xl mx-auto animate-fade-in">
                <div className="bg-white border-4 border-amber-300 rounded-[32px] p-6 sm:p-8 shadow-2xl w-full flex flex-col gap-5 relative overflow-hidden">
                  <span className="text-7xl animate-bounce">🌳</span>
                  <h2 className="text-3xl font-black text-amber-950 Jua">도토리 영어 탐험대</h2>
                  <p className="text-xs sm:text-sm text-slate-600 font-bold leading-relaxed">
                    도토리 숲속 배움공책 탐험선에 오신 것을 환영합니다!<br/>
                    먼저 반, 번호, 이름을 쓰고 숲속으로 입장해 보세요.
                  </p>

                  <form onSubmit={handleRegisterStudent} className="flex flex-col gap-4 text-left">
                    <div>
                      <label className="block text-xs font-black text-slate-500 mb-1">🏫 학년 (고정)</label>
                      <div className="w-full bg-slate-100 border-2 border-slate-200 rounded-2xl px-4 py-3 font-bold text-slate-600">
                        3학년
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-black text-slate-500 mb-1">🚪 학반 선택</label>
                        <select 
                          value={studentClass}
                          onChange={(e) => setStudentClass(e.target.value)}
                          className="w-full bg-slate-50 border-2 border-amber-300 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none focus:border-amber-500 transition"
                        >
                          {Array.from({ length: 10 }, (_, i) => i + 1).map((val) => (
                            <option key={val} value={val}>{val}반</option>

                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-black text-slate-500 mb-1">🏷️ 번호 선택</label>
                        <select 
                          value={studentNum}
                          onChange={(e) => setStudentNum(e.target.value)}
                          className="w-full bg-slate-50 border-2 border-amber-300 rounded-2xl px-4 py-3 font-bold text-slate-800 outline-none focus:border-amber-500 transition"
                        >
                          {Array.from({ length: 30 }, (_, i) => i + 1).map((val) => (

                          ))}

                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-black text-slate-500 mb-1">✍️ 내 이름 입력</label>
                      <input 
                        type="text"
                        required
                        placeholder="이름을 입력해 주세요"
                        value={studentName}
                        onChange={(e) => setStudentName(e.target.value)}
                        className="w-full bg-slate-50 border-2 border-amber-300 rounded-2xl px-4 py-3 font-bold text-slate-800 placeholder-slate-400 outline-none focus:border-amber-500 transition"

                    >

                    </button>
                  </form>

                  <div className="flex flex-col gap-2 mt-2">
                    <button 
                      onClick={() => setShowPasswordModal(true)}
                      className="text-xs text-slate-500 font-bold underline hover:text-slate-700"
                    >
                      🔑 선생님 관제 대시보드 로그인
                    </button>

                                      </button>
                                    </div>

                                    <div className="min-h-[1.2rem] text-[11px] font-black">
                                      {speechStatus === 'listening' && <span className="text-amber-600 animate-pulse">🎤 소리를 듣고 있어요... 대답하세요!</span>}
                                      {speechStatus === 'success' && <span className="text-emerald-600">🎉 참 잘했어요! 정답입니다! 👍</span>}
                                      {speechStatus === 'fail' && <span className="text-rose-600">기회를 모두 마쳤어요. 정답을 확인해보세요!</span>}
                                      {speechStatus === 'idle' && heardText && <span className="text-slate-600">인식된 음성: "{heardText}"</span>}
                                    </div>
                                  </div>
                                )}

                                {currentQuestion.question.type === 'CHOICE' && (
                                  <div className="flex flex-col items-center gap-2">
                                    <div className="flex flex-col sm:flex-row gap-2 w-full justify-center">
                                      {currentQuestion.question.options.map((opt) => (
                                        <button
                                          key={opt}
                                          onClick={() => selectChoice(opt)}
                                          className="bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 font-black text-emerald-800 px-4 py-2 rounded-xl text-xs sm:text-sm capitalize transition"
                                        >
                                          {opt}
                                        </button>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {currentQuestion.question.type === 'PHONICS' && (
                                  <div className="flex flex-col items-center gap-2">
                                    <div className="flex gap-3 w-full justify-center">
                                      {currentQuestion.question.options.map((opt) => (
                                        <button
                                          key={opt}
                                          onClick={() => selectChoice(opt)}
                                          className="bg-gradient-to-b from-amber-100 to-amber-200 border-2 border-amber-400 font-black text-amber-950 px-6 py-2 rounded-xl text-2xl font-mono transition-all"
                                        >
                                          /{opt}/
                                        </button>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {currentQuestion.question.type === 'WRITING' && (
                                  <div className="flex flex-col items-center gap-2">
                                    {!showWritingPaper ? (
                                      <div className="flex flex-col items-center gap-2 w-full">
                                        <div className="p-3 bg-gradient-to-br from-sky-50 to-indigo-50 border border-sky-100 rounded-2xl text-xs font-black text-sky-950 max-w-sm text-left">
                                          📝 <strong>내 종이 배움공책(학습지)</strong>에 연필로 올바른 철자를 작성한 뒤 아래 "정답 확인"을 눌러 대조해 보세요.
                                        </div>
                                        <button 
                                          onClick={handleShowOfflineWritingAnswer}
                                          className="w-full max-w-xs bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs py-3 rounded-xl shadow-md transition"
                                        >
                                          ✍ 공책 작성 완료! 정답 확인 👀
                                        </button>
                                      </div>
                                    ) : (
                                      <div className="w-full max-w-sm flex flex-col gap-2">
                                        <FourLineNotebook text={currentQuestion.question.textToDraw} />
                                        <div className="flex flex-col gap-1.5 bg-slate-50 p-2 rounded-xl border">
                                          <span className="text-[10px] font-bold text-slate-600">공책에 바르게 적었나요?</span>
                                          <div className="flex gap-2">
                                            <button onClick={() => handleOfflineWritingConfirm('success')} className="flex-1 bg-emerald-600 text-white font-black text-[10px] py-1.5 rounded-lg shadow">네, 성공!</button>
                                            <button onClick={() => handleOfflineWritingConfirm('fail')} className="flex-1 bg-rose-500 text-white font-black text-[10px] py-1.5 rounded-lg shadow">아니요, 틀렸어요</button>
                                          </div>
                                        </div>
                                      </div>
                                    )}
                                  </div>
                                )}

                                {currentQuestion.question.type === 'COLORING' && (
                                  <div className="flex flex-col items-center gap-2 bg-slate-50/50 p-2.5 rounded-2xl border">
                                    <div className="flex gap-2 justify-center py-1">
                                      {coloredMice.map((isColored, idx) => (
                                        <button
                                          key={idx}
                                          onClick={() => handleColorMouse(idx)}
                                          className={`w-11 h-11 rounded-full border flex items-center justify-center text-2xl shadow-sm ${isColored ? 'bg-yellow-300 border-yellow-500 animate-pulse' : 'bg-white border-slate-300'}`}
                                        >
                                          🐁
                                        </button>
                                      ))}
                                    </div>
                                    <div className="text-[10px] font-bold text-amber-700">생쥐 노란색으로 터치: {coloredMice.filter(Boolean).length} / 2</div>
                                  </div>
                                )}

                                {currentQuestion.question.type === 'WORDPOP' && (
                                  <div className="flex flex-col items-center gap-2">
                                    <div className="grid grid-cols-2 gap-2 w-full max-w-sm">
                                      {[
                                        { key: 'ball', label: '🎈 ball', color: 'bg-rose-400 border-rose-500 text-white' },
                                        { key: 'close', label: '🎈 close', color: 'bg-emerald-400 border-emerald-500 text-white' },
                                        { key: 'duck', label: '🎈 duck', color: 'bg-sky-400 border-sky-500 text-white' },
                                        { key: 'pizza', label: '🎈 pizza', color: 'bg-amber-400 border-amber-500 text-slate-800' }
                                      ].map((b) => (
                                        <button
                                          key={b.key}
                                          onClick={() => handlePopBubble(b.key)}
                                          className={`p-2 rounded-xl font-black text-[11px] border shadow-sm transition-all ${poppedBubbles[b.key] ? 'popped-bubble' : b.color}`}
                                        >
                                          {poppedBubbles[b.key] ? '💥 POP!' : b.label}
                                        </button>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {currentQuestion.question.type === 'ALPHABET_SONG' && (
                                  <div className="flex flex-col items-center gap-2">
                                    <div className="bg-white rounded-xl p-3 shadow-inner text-center w-full max-h-[140px] overflow-y-auto">
                                      <p className="font-handwriting font-bold text-sm text-slate-800 tracking-wide leading-relaxed">
                                        A B C D E F G<br/>
                                        H I J K L M N<br/>
                                        O P Q R S T U<br/>
                                        V W X Y Z
                                      </p>
                                    </div>
                                    <button 
                                      onClick={() => { playSound('correct'); resolveQuestion(true); }}
                                      className="w-full bg-indigo-600 text-white font-black text-xs py-3 rounded-xl transition animate-pulse"
                                    >
                                      🎤 큰 소리로 따라 불렀어요! (통과)
                                    </button>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>

                          {currentQuestion.question.type !== 'ALPHABET_SONG' && !currentQuestion.isAI && (
                            <div className="flex items-center justify-center gap-2 w-full border-t pt-2 mt-auto">
                              {currentQuestion.question.expectedAnswers && (
                                <button onClick={() => speakText(currentQuestion.question.expectedAnswers[0])} className="bg-sky-50 text-sky-800 font-bold text-[10px] px-3 py-1.5 rounded-lg border flex items-center justify-center gap-1 shadow-sm">발음 듣기</button>
                              )}
                              <button onClick={() => setShowAnswerText(!showAnswerText)} className="bg-pink-50 text-pink-800 font-bold text-[10px] px-3 py-1.5 rounded-lg border flex items-center justify-center gap-1 shadow-sm">정답 가이드</button>
                            </div>
                          )}
                        </div>
                      </div>

                      {showAnswerText && currentQuestion.question.expectedAnswers && (
                        <div className="bg-pink-50 border border-pink-200 rounded-xl p-2 text-xs font-black text-pink-850">
                          스펠링 정답: <span className="underline italic font-mono text-[11px]">{currentQuestion.question.expectedAnswers.join(' / ')}</span>
                        </div>
                      )}

                      <div className="flex items-center justify-between w-full pt-2">
                        <button onClick={() => resolveQuestion(true)} className="ml-auto text-slate-400 hover:text-slate-600 text-[8px] font-black tracking-widest bg-slate-100 px-2.5 py-1 rounded-lg border transition">
                          PASS (다음 단계로)
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* ========================================== */}
          {/* [GLOBAL OVERLAYS] 최상위 레이어 통합 렌더링 영역 */}
          {/* ========================================== */}

          {/* 1. 선생님 로그인 대화상자 */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fade-in">
              <div className="bg-white text-slate-800 rounded-[28px] p-6 max-w-sm w-full border-4 border-amber-400 shadow-2xl text-center">
                <span className="text-5xl">🔑</span>
                <h3 className="text-xl font-black text-amber-950 mt-3">교사용 관제소 진입</h3>
                <p className="text-xs text-slate-500 font-medium mt-1">대시보드를 연동하기 위해 관리자 비밀번호를 입력하세요.</p>
                
                <form onSubmit={handlePasswordVerify} className="flex flex-col gap-3 mt-4">
                  <input 
                    type="password"
                    required
                    placeholder="비밀번호 입력"
                    value={teacherPassword}
                    onChange={(e) => setTeacherPassword(e.target.value)}
                    className="bg-slate-100 border-2 rounded-xl px-4 py-2 text-center font-bold text-sm tracking-widest focus:outline-none focus:border-amber-400"
                  />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => { playSound('click'); setShowPasswordModal(false); setTeacherPassword(''); }} className="flex-1 bg-slate-200 text-slate-700 font-bold text-xs py-2 rounded-xl">취소</button>
                    <button type="submit" className="flex-1 bg-amber-500 text-amber-950 font-black text-xs py-2 rounded-xl transition shadow">확인</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 2. Firebase 실시간 배포 구성용 연동 대화상자 (하드코딩 설정이 있으므로 관리자 필요 시에만 사용) */}
          {showDbConfigModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-[100] animate-fade-in">
              <div className="bg-white text-slate-800 rounded-[32px] p-6 max-w-lg w-full border-4 border-indigo-400 shadow-2xl text-left max-h-[90vh] overflow-y-auto">
                <div className="text-center mb-4">
                  <span className="text-5xl">⚙️</span>
                  <h3 className="text-2xl font-black text-indigo-950 mt-2">Firebase 실시간 연동 마법사</h3>
                  <p className="text-xs text-slate-500 font-bold mt-1">Vercel 및 일반 웹 서버 개별 배포용 데이터베이스 자율 연동</p>
                </div>

                <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl text-xs text-indigo-950 font-medium mb-4 leading-relaxed">
                  📌 <strong>연동 설정 안내:</strong><br/>
                  1. Firebase Console에서 새 프로젝트를 만든 후 <strong>Firestore Database</strong> 및 <strong>익명 로그인(Anonymous Auth)</strong>을 활성화해 주세요.<br/>
                  2. 앱 설정에서 웹 앱을 생성한 뒤 발급되는 SDK 설정 구성 요소값을 아래에 채워주세요.<br/>
                  3. 저장 단추를 누르면 브라우저의 안전한 로컬 영역에 저장되어 실시간 관제판이 전송됩니다.
                </div>

                <form onSubmit={handleSaveDynamicConfig} className="flex flex-col gap-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">API Key (필수)</label>
                      <input type="text" required placeholder="AIzaSy..." value={inputApiKey} onChange={(e) => setInputApiKey(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">Project ID (필수)</label>
                      <input type="text" required placeholder="my-project-id" value={inputProjectId} onChange={(e) => setInputProjectId(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">App ID (필수)</label>
                      <input type="text" required placeholder="1:12345:web:abcd" value={inputAppId} onChange={(e) => setInputAppId(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">Auth Domain (선택)</label>
                      <input type="text" placeholder="자동 생성 적용" value={inputAuthDomain} onChange={(e) => setInputAuthDomain(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">Storage Bucket (선택)</label>
                      <input type="text" placeholder="자동 생성 적용" value={inputStorageBucket} onChange={(e) => setInputStorageBucket(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                    <div>
                      <label className="block text-[10px] font-black text-slate-500 mb-0.5">Messaging Sender ID (선택)</label>
                      <input type="text" placeholder="숫자 입력" value={inputMessagingSender} onChange={(e) => setInputMessagingSender(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none focus:border-indigo-400"/>
                    </div>
                  </div>

                  <div className="border-t pt-2 mt-1">
                    <label className="block text-[10px] font-black text-slate-500 mb-0.5">📁 커스텀 배움터 식별 ID (App ID 구분용)</label>
                    <input type="text" placeholder={DEFAULT_APP_ID} value={inputCustomAppId} onChange={(e) => setInputCustomAppId(e.target.value)} className="w-full bg-slate-50 border-2 rounded-xl px-3 py-1.5 text-xs font-bold text-indigo-900 focus:outline-none focus:border-indigo-400"/>
                    <span className="text-[9px] text-slate-400 font-bold block mt-0.5">기본값 사용 시 여러 반의 기록이 같은 DB에 분류되어 누적됩니다.</span>
                  </div>

                  <div className="flex gap-2 mt-4">
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs py-3 rounded-xl transition shadow">
                      💾 설정 저장 및 탐험 시작 🌳
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3. Firebase 연동 정보 제거 알림 커스텀 컨펌 모달 (브라우저 confirm() 완전 배제) */}
          {showClearConfigConfirm && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-[100] animate-fade-in">
              <div className="bg-white text-slate-800 rounded-[28px] p-6 max-w-sm w-full border-4 border-red-500 shadow-2xl text-center">
                <span className="text-5xl">🗑️</span>
                <h3 className="text-xl font-black text-slate-950 mt-3">데이터베이스 초기화</h3>
                <p className="text-xs text-slate-500 font-medium mt-1">저장된 연동 설정을 정말로 삭제하시겠습니까? 삭제 후 웹페이지가 자동으로 새로고침됩니다.</p>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => { playSound('click'); setShowClearConfigConfirm(false); }} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2 rounded-xl">취소</button>
                  <button onClick={executeClearConfig} className="flex-1 bg-red-600 text-white font-black text-xs py-2 rounded-xl transition shadow">예, 삭제합니다</button>
                </div>
              </div>
            </div>
          )}

          {/* 4. 시스템 안내 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white font-bold px-6 py-3.5 rounded-2xl shadow-2xl border border-slate-700 z-[100] animate-bounce flex items-center gap-2 text-xs sm:text-sm">
              <span>🔔</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
